<html>
    <head>
        <title>
            Library books grid
        </title>
        <style>
             .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            border: 1px solid papayawhip;
            padding: 10px;
        }
            .box {
                background-color: pink;
                padding: 20px;
                text-align: center;
                font-weight: bold;
            }
        </style>
        <body>
            <h1 style="color :palevioletred;" align="center">LIBRARY BOOK CATEGORIES</h1>
         <div class="container">
           <div class="box">SCIENCE</div>
             <div class="box">MATHEMATICS</div>
              <div class="box">TECHNOLOGY</div>
               <div class="box">ARTS</div>
                <div class="box">HISTORY</div>
                 <div class="box">LITRATURE</div>
            </div>
        </body>
    </head>
</html>
