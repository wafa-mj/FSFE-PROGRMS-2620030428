<html>
    <head>
        <style>
            body { font-family:'Arial Narrow', Arial, sans-serif;
        height : 1.5;}
        .tight { line-height : 15;
        }
        .loose { line-height : 1.8;
        }
        .light {font-weight: 300;
        }
        .bold { font-weight: 900;
        }  </style></head> 
        <p class="tight">
            Tight line-height makes the text harder to read when the content is long.
        </p>
        <p class="loose">
            Loose line-height makes the text readable especially the paragraphs.
        </p>
        <p class="light">
            Light font-weight is subtle and modern.
        </p>
        <p class="bold">
            Bold font-weight is good for emphasis and headings.
        </p>
</html>
